    <!-- Header -->
    <header class="border-b border-border px-6 py-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-3 flex-wrap">
            <h1 class="text-xl font-semibold tracking-tight"
                data-help-title="{{help.header.headroom.title}}" data-help="{{help.header.headroom.body}}">HEADROOM</h1>
            <span class="text-xs text-gray-500 font-mono" x-text="'v' + version"
                  data-help-title="{{help.header.version.title}}" data-help="{{help.header.version.body}}"></span>
            <!-- Status cluster: health · updated · uptime (top-left) -->
            <template x-if="showStatusCluster">
                <div class="flex items-center gap-2 text-xs text-gray-500" aria-live="polite">
                    <span class="text-gray-700">|</span>
                    <span class="relative" x-data="{ hcOpen: false }" @mouseenter="hcOpen = true" @mouseleave="hcOpen = false">
                        <span class="flex items-center gap-1.5"
                              :data-help-title="healthy ? helpText.header.proxy_healthy.title : helpText.header.proxy_error.title"
                              :data-help="healthy ? helpText.header.proxy_healthy.body : (healthErrorReason || helpText.header.proxy_error.body)">
                            <span class="w-2 h-2 rounded-full pulse-live"
                                  :class="healthy ? 'bg-emerald-400' : 'bg-red-400'"></span>
                            <span class="text-sm" :class="healthy ? 'text-gray-300' : 'text-red-400'"
                                  x-text="healthy ? 'Healthy' : 'Error'"></span>
                        </span>
                        <!-- Instant System Health popover: reuses doctor.checks, no new fetch.
                             pt-2 (not mt-2) on the hit-box wrapper keeps the hoverable area
                             touching the trigger with no dead zone; the visible card sits in
                             the nested div so the padding doesn't show as extra whitespace inside it. -->
                        <div x-show="hcOpen && doctor.checks.length > 0" x-cloak
                             class="absolute left-0 top-full pt-2 w-80"
                             style="z-index: 60;">
                          <div class="max-h-72 overflow-y-auto rounded-lg border border-border bg-surface shadow-xl p-2 text-left">
                            <div class="text-[10px] uppercase tracking-wide text-gray-500 px-1 pb-1">System Health</div>
                            <template x-for="check in doctor.checks" :key="check.name">
                                <div class="flex items-start gap-2 px-1 py-1">
                                    <span class="text-sm leading-none mt-0.5"
                                          :class="check.status === 'pass' ? 'text-emerald-400' : (check.status === 'fail' ? 'text-red-400' : 'text-amber-400')"
                                          x-text="check.status === 'pass' ? '✓' : (check.status === 'fail' ? '✗' : '!')"></span>
                                    <div class="min-w-0">
                                        <div class="text-xs font-medium text-gray-300 uppercase tracking-wide" x-text="check.name"></div>
                                        <div class="text-[11px] text-gray-500 break-words" x-text="check.summary"></div>
                                    </div>
                                </div>
                            </template>
                          </div>
                        </div>
                    </span>
                    <span class="text-gray-700">·</span>
                    <span data-help-title="{{help.header.last_update.title}}" data-help="{{help.header.last_update.body}}">Updated <span x-text="lastUpdate"></span></span>
                    <template x-if="uptimeSeconds > 0">
                        <span class="flex items-center gap-2">
                            <span class="text-gray-700">·</span>
                            <span data-help-title="{{help.header.proxy_uptime.title}}" data-help="{{help.header.proxy_uptime.body}}">Up <span class="text-gray-300 font-mono" x-text="uptimeText"></span></span>
                        </span>
                    </template>
                </div>
            </template>
        </div>
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:gap-6">
            <div class="inline-flex rounded-lg border border-border bg-surface p-1">
                <button x-show="tabVisible('session')" class="px-3 py-1.5 text-sm rounded-md transition-colors"
                        :class="viewMode === 'session' ? 'bg-accent text-black' : 'text-gray-400 hover:text-gray-200'"
                        @click="setViewMode('session')"
                        data-help-title="{{help.header.session_view.title}}" data-help="{{help.header.session_view.body}}">
                    Session
                </button>
                <button x-show="tabVisible('history')" class="px-3 py-1.5 text-sm rounded-md transition-colors"
                        :class="viewMode === 'history' ? 'bg-accent text-black' : 'text-gray-400 hover:text-gray-200'"
                        @click="setViewMode('history')"
                        data-help-title="{{help.header.historical_view.title}}" data-help="{{help.header.historical_view.body}}">
                    Historical
                </button>
                <button x-show="tabVisible('mcp')" class="px-3 py-1.5 text-sm rounded-md transition-colors"
                        :class="viewMode === 'mcp' ? 'bg-accent text-black' : 'text-gray-400 hover:text-gray-200'"
                        @click="setViewMode('mcp')"
                        data-help-title="{{help.header.mcp_view.title}}" data-help="{{help.header.mcp_view.body}}">
                    MCP
                </button>
            </div>
            <template x-if="stats.anon_telemetry_shipping">
                <div class="inline-flex items-center gap-1.5 rounded-full border border-amber-500/40 bg-amber-500/10 px-2.5 py-1"
                     data-help-title="{{help.header.anonymous_telemetry.title}}" data-help="{{help.header.anonymous_telemetry.body}}">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                         class="w-3 h-3 text-amber-400 shrink-0">
                        <path fill-rule="evenodd"
                              d="M6.701 2.25c.577-1 2.02-1 2.598 0l5.196 9a1.5 1.5 0 0 1-1.299 2.25H2.804a1.5 1.5 0 0 1-1.3-2.25l5.197-9ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                              clip-rule="evenodd"/>
                    </svg>
                    <span class="text-xs text-amber-400 font-medium">Anon Telemetry</span>
                </div>
            </template>
            <template x-if="stats.config && stats.config.savings_profile">
                <div class="inline-flex items-center gap-1.5 rounded-full border border-cyan-500/40 bg-cyan-500/10 px-2.5 py-1"
                     data-help-title="{{help.header.active_profile.title}}" :data-help="helpText.header.active_profile.body.replace('{value}', stats.config.savings_profile)">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
                    <span class="text-xs text-cyan-100">
                        <span x-text="stats.config.savings_profile"></span>
                        <template x-if="stats.config.target_savings_percent !== null">
                            <span x-text="' · target ' + stats.config.target_savings_percent + '%'"></span>
                        </template>
                    </span>
                </div>
            </template>
            <!-- Action buttons: GitHub · Report · MCP Dashboards · Settings · Theme -->
            <div class="flex items-center gap-1.5">
                <a href="https://github.com/headroomlabs-ai/headroom" target="_blank" rel="noopener"
                   class="px-2 py-1.5 rounded-md border border-border bg-surface text-gray-400 hover:text-gray-200 transition-colors"
                   aria-label="View Headroom on GitHub"
                   data-help-title="{{help.header.github.title}}" data-help="{{help.header.github.body}}">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 .5C5.73.5.5 5.73.5 12a11.5 11.5 0 007.86 10.92c.575.106.785-.25.785-.556 0-.274-.01-1-.015-1.965-3.196.695-3.87-1.54-3.87-1.54-.523-1.33-1.276-1.684-1.276-1.684-1.043-.713.08-.699.08-.699 1.153.081 1.76 1.184 1.76 1.184 1.026 1.758 2.69 1.25 3.346.956.104-.744.402-1.25.73-1.538-2.552-.29-5.236-1.276-5.236-5.68 0-1.255.448-2.28 1.183-3.084-.119-.29-.513-1.46.112-3.045 0 0 .965-.309 3.163 1.178a10.98 10.98 0 015.76 0c2.196-1.487 3.16-1.178 3.16-1.178.626 1.585.232 2.755.114 3.045.737.804 1.182 1.83 1.182 3.084 0 4.415-2.688 5.386-5.248 5.67.413.356.78 1.057.78 2.13 0 1.54-.014 2.78-.014 3.158 0 .308.207.667.79.554A11.5 11.5 0 0023.5 12C23.5 5.73 18.27.5 12 .5z"/>
                    </svg>
                </a>
                <a href="https://github.com/headroomlabs-ai/headroom/issues/new" target="_blank" rel="noopener"
                   class="px-2 py-1.5 rounded-md border border-border bg-surface text-gray-400 hover:text-gray-200 transition-colors"
                   aria-label="Report an issue on GitHub"
                   data-help-title="{{help.header.report_an_issue.title}}" data-help="{{help.header.report_an_issue.body}}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                    </svg>
                </a>
                <div class="relative" x-data="{ open: false }" @click.outside="open = false"
                     x-show="showMcpButton && mcpDashboards.length > 0">
                    <button @click="open = !open" id="mcp-dashboards-toggle"
                            class="px-3 py-1.5 text-sm rounded-md border border-border bg-surface text-gray-300 hover:text-gray-100 transition-colors flex items-center gap-1"
                            data-help-title="{{help.header.mcp_dashboards.title}}" data-help="{{help.header.mcp_dashboards.body}}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                        MCP Dashboards
                    </button>
                    <div x-show="open" x-transition
                         class="absolute right-0 mt-2 w-64 z-20 bg-surface border border-border rounded-lg shadow-lg p-2">
                        <template x-for="d in mcpDashboards" :key="d.name">
                            <a :href="d.url" target="_blank" rel="noopener"
                               class="flex items-center justify-between px-3 py-2 rounded-md text-sm text-gray-300 hover:bg-black/20 transition-colors">
                                <span x-text="d.label"></span>
                                <span class="w-2 h-2 rounded-full"
                                      :class="d.available ? 'bg-emerald-400' : 'bg-gray-500'"
                                      :data-help-title="d.label"
                                      :data-help="d.available ? helpText.header.mcp_dashboard_available.body : helpText.header.mcp_dashboard_unavailable.body"></span>
                            </a>
                        </template>
                    </div>
                </div>
                <button id="feed-toggle"
                        class="px-3 py-1.5 text-sm rounded-md border border-border bg-surface text-gray-300 hover:text-white transition-colors focus:ring-2 focus:ring-accent focus:outline-none"
                        @click="toggleFeed()"
                        :class="feedOpen ? 'bg-accent text-black' : ''"
                        :data-help="log_full_messages
                            ? helpText.header.live_feed_toggle_on.body
                            : helpText.header.live_feed_toggle_off.body"
                        data-help-title="{{help.header.live_feed_toggle_on.title}}">
                    Live Feed
                </button>
                <button @click="openSettings()" id="settings-toggle"
                        class="px-3 py-1.5 text-sm rounded-md border border-border bg-surface text-gray-400 hover:text-gray-200 transition-colors"
                        data-help-title="{{help.header.settings.title}}" data-help="{{help.header.settings.body}}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </button>
                <button onclick="toggleTheme()" id="theme-toggle"
                        class="px-3 py-1.5 text-sm rounded-md border border-border bg-surface text-gray-400 hover:text-gray-200 transition-colors"
                        data-help-title="{{help.header.theme.title}}" data-help="{{help.header.theme.body}}">
                    <svg class="w-4 h-4 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                    </svg>
                    <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>
